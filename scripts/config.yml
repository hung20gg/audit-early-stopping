agent_kwargs:
  simple:
    max_steps: 50
  simple_full:
    max_steps: 50
  vanilla:
    token_budgets:
      # - 100
      - 500
      - 1000
      - 2000
      - 5000
      - 10000
      - 20000
  vanilla_reuse:
    token_budgets:
      # - 100
      - 500
      - 1000
      - 2000
      - 5000
      - 10000
      - 20000
  deer:
    max_steps: 5000
    threshold: 0.95
    probe_tokens: 20
    probe_logprobs: 3
  deer_full:
    max_steps: 5000
    threshold: 0.95
    probe_tokens: 20
    probe_logprobs: 3
  dtsr:
    max_steps: 5000
    threshold: 99
    min_interval: 64
  dtsr_full:
    max_steps: 5000
    threshold: 99
    min_interval: 64
  dtsr_reuse:
    max_steps: 5000
    threshold: 99
    min_interval: 64
  puma:
    max_steps: 5000
    similarity_threshold: 0.35
    confidence_threshold: 0.98
    epsilon: 0.03
    consecutive: 2
    probe_tokens: 15
    probe_logprobs: 3
    window_size: 1
    consecutive_redundancy_stop: 50
  puma_full:
    max_steps: 5000
    similarity_threshold: 0.35
    confidence_threshold: 0.98
    epsilon: 0.03
    consecutive: 2
    probe_tokens: 15
    probe_logprobs: 3
    window_size: 1
    consecutive_redundancy_stop: 50
  replay_eval:
    # false: save every confirmed exit as method:1, method:2, ... and continue.
    exit: true
    # 1: existing synchronous replay; 2: asynchronous native-vLLM replay.
    version: 1
    verify_batch_token: 16
    final_answer_batch_size: 16
    code_probe_token_multiplier: 5
    code_threshold_multiplier: 1.0
    v2:
      random_exit:
        enabled: false
        sample_size: 64
        sample_seed: 0
        position_seed: 0
        spacing: 32
        max_positions: 64
        num_runs: 6
        min_valid_positions: 5
      runtime:
        max_concurrency: 8
        example_concurrency: 2
        # Skip an example with a warning when its complete replay exceeds 5 minutes.
        example_timeout_seconds: 600
        warmup: true
        rerun_all: true
        rerun_final_answer: false
        max_final_answer_completion_token: 3072
        # Accept the first checkpoint per method, then require this token gap.
        min_interval: 32 # 64
        sampling:
          temperature: 0.6
          max_tokens: 38000
      extraction:
        mode: callback
        callback: replay_eval.v2.engine.vllm_hidden_states.extract_trace
        temp_dir: /tmp/replay-v2-extraction
        # Empty layers disable DoLa extraction for replay runs.
        dola_layers: []
      methods:
        - factory: replay_eval.v2.runtime.hidden_models.build_terminator_method
          kwargs:
            name: terminator_hf
            artifact_dir: checkpoints/terminator/replay/r1_qwen3_8b
            threshold: 0.51
            classification_threshold: 0.7
            replay_tokens: 16
            window_size: 10
            precompute_chunk_size: 256
            device: cuda
            dtype: auto
            position_mode: assistant_relative
        - factory: replay_eval.v2.runtime.hidden_models.build_thought_calibration_method
          kwargs:
            name: thought_calibration
            artifact_dir: checkpoints/thought_calibration/replay/r1_qwen3_8b
            risk_tolerance: 0.05
            check_every: 64
            device: cuda
            dtype: auto
    methods:
      - factory: replay_eval.methods.build_deer_method
        kwargs:
          name: deer
          threshold: 0.95
          probe_tokens: 20
          probe_logprobs: 5
          reflection_signals:
            - "wait"
            - "Wait"
            - "but"
            - "But"
      - factory: replay_eval.methods.build_entrocut_method
        kwargs:
          name: entrocut
          threshold: 0.2
          probe_tokens: 20
          probe_logprobs: 20
          reflection_signals:
            - "wait"
            - "Wait"
            - "but"
            - "But"
      - factory: replay_eval.methods.build_statistical_method
        kwargs:
          name: statistical_early_stop
          B: 256 # 96
          alpha: 0.025 # 0.05
      - factory: replay_eval.methods.build_codestop_method
        kwargs:
          name: codestop
          conf_threshold: 0.95
          degen_threshold: 1.0
          stop_word: "Wait"
          reflection_signals:
            - "wait"
            - "Wait"
            - "but"
            - "But"
          probe_tokens: 20
          probe_logprobs: 5
          use_log: true
          ewt: true
      - factory: replay_eval.methods.build_dtsr_method
        kwargs:
          name: dtsr
          threshold: 80
          min_interval: 128 # 96
          llm: same
          probe_tokens: 20
          reflection_signals:
            - "wait"
            - "Wait"
            - "but"
            - "But"
      - factory: replay_eval.methods.build_answer_coverage_method
        kwargs:
          name: answer-coverage
          check_every: 128 # 128
          window_size: 10
          collect_answer: evaluator.math500.extract_final_answer
          collect_coding_answer: evaluator.code_exec.code_exec_equal_public
          llm: same
      - factory: replay_eval.methods.build_dynasor_method
        kwargs:
          name: dynasor
          check_every: 128 # 128
          window_size: 5
          consistency_threshold: 0.8
          uncertainty_signals:
            - "wait"
            - "hmm"
            - "but"
          collect_answer: evaluator.math500.extract_final_answer
          collect_coding_answer: evaluator.code_exec.code_exec_equal_public
          llm: same

      # - factory: replay_eval.methods.build_puma_method
