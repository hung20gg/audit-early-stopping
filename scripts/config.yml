llm:
  default: qwen3_32b_think
  logprobs: 50
  include_detailed_logprobs: false
  # Global native-vLLM configuration. A selected model may override any
  # individual value through llm.models.<name>.vllm.
  vllm:
    dtype: bfloat16
    max_model_len: 39000
    max_logprobs: 50
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.7
    environment:
      # FlashInfer sampling is separate from the attention backend. FlashInfer
      # 0.6.x can misclassify SM120 as older than SM75; use the native sampler.
      VLLM_USE_FLASHINFER_SAMPLER: "0"
    engine_kwargs:
      enforce_eager: true
      worker_extension_cls: replay_eval.v2.engine.vllm_hidden_states.HiddenStateWorkerExtension
    serving:
      enable_prefix_caching: true
      enable_chunked_prefill: true
      max_num_seqs: 8
      # Hidden capture retains two full hidden streams in addition to vLLM's
      # normal prefill workspace. Keep chunks small on 32 GiB cards.
      max_num_batched_tokens: 2048
  completion_kwargs:
    stop:
      # - "\n\n"
      - "wait"
      - "Wait"
      - "Alternative"
      - "Alternatively"
      - "But wait"
      - "But let me"
      - "But let's"
      - "But let’s"
    max_thinking_completion_token: 64
    max_completion_token: 32000  # Total thinking budget before forced finalization.
    max_final_answer_completion_token: 3072  # 2048
    max_temp_answer_completion_token: 16 # 512
  models:
    qwen3_8b_think:
      name: qwen3_8b_think
      id: vllm:Qwen/Qwen3-8B
      think_start_token: "<think>"
      think_end_token: "</think>"
      chat_template:
        type: hf
        model_id: Qwen/Qwen3-8B
        add_generation_prompt: true
        kwargs:
          enable_thinking: true
      completion_kwargs:
        temperature: 0.6
    
    qwen3_8b_no_think:
      name: qwen3_8b_no_think
      id: vllm:Qwen/Qwen3-8B
      think_start_token: "<think>"
      think_end_token: "</think>"
      chat_template:
        type: hf
        model_id: Qwen/Qwen3-8B
        add_generation_prompt: true
        kwargs:
          enable_thinking: false
      completion_kwargs:
        temperature: 0.6
    
